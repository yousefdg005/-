{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-4">
        <div class="card shadow-sm border-0 rounded-3">
            <div class="card-body p-4">
                <h3 class="card-title text-center mb-4 text-primary fw-bold">Secure Login</h3>
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label text-muted">Username</label>
                        <input type="text" name="username" class="form-control" placeholder="Enter username" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label text-muted">Password</label>
                        <input type="password" name="password" class="form-control" placeholder="Enter password" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 btn-custom py-2 fw-bold">Login</button>
                </form>
                <hr class="my-4">
                <div class="text-center">
                    <p class="mb-0 text-muted">New Reader? <a href="{{ url_for('register') }}" class="text-success text-decoration-none fw-bold">Create Reader Account</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
