{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center mt-4">
    <div class="col-md-8 col-lg-6">
        <div class="card shadow-lg border-0 rounded-3">
            <div class="card-header bg-dark text-white fw-bold">🔑 تغيير كلمة المرور</div>
            <div class="card-body p-4">
                <p class="text-gray mb-4">لأمانك، يُطلب منك إدخال كلمة المرور الحالية قبل تعيين كلمة المرور الجديدة.</p>
                <form method="POST" action="{{ url_for('change_password') }}">
                    <div class="mb-3">
                        <label class="form-label fw-bold text-muted">كلمة المرور الحالية</label>
                        <input type="password" name="current_password" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold text-muted">كلمة المرور الجديدة (8 أحرف على الأقل)</label>
                        <input type="password" name="new_password" class="form-control" minlength="8" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold text-muted">تأكيد كلمة المرور الجديدة</label>
                        <input type="password" name="confirm_password" class="form-control" minlength="8" required>
                    </div>
                    <button type="submit" class="btn btn-warning w-100 btn-custom fw-bold">حفظ كلمة المرور الجديدة</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
